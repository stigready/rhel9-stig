- block:
  - name: 'Add nodev Option to /home: Check information associated to mountpoint'
    command: findmnt --fstab '/home'
    register: device_name
    failed_when: device_name.rc > 1
    changed_when: false
    when:
    - ( not ( "kernel" in ansible_facts.packages and "rpm-ostree" in ansible_facts.packages and "bootc" in ansible_facts.packages
      and not "openshift-kubelet" in ansible_facts.packages ) and not ( ansible_virtualization_type in ["docker", "lxc", "openvz",
      "podman", "container"] ) )
    - '"/home" in ansible_mounts | map(attribute="mount") | list'
    tags:
    - CCE-83871-4
    - DISA-STIG-RHEL-09-231045
    - configure_strategy
    - high_disruption
    - low_complexity
    - mount_option_home_nodev
    - no_reboot_needed
    - unknown_severity
  rescue:
  - name: 'StigForge: continue after error in ''Add nodev Option to /home: Check information associated to mountpoint'' (OpenSCAP
      is the score gate)'
    ansible.builtin.debug:
      msg: 'StigForge: ''Add nodev Option to /home: Check information associated to mountpoint'' raised an error (module or
        templating) and was skipped; continuing so later rules still run. OpenSCAP evaluates the resulting system state independently.'
- block:
  - name: 'Add nodev Option to /home: Create mount_info dictionary variable'
    set_fact:
      mount_info: '{{ mount_info|default({})|combine({item.0: item.1}) }}'
    with_together:
    - '{{ device_name.stdout_lines[0].split() | list | lower }}'
    - '{{ device_name.stdout_lines[1].split() | list }}'
    when:
    - ( not ( "kernel" in ansible_facts.packages and "rpm-ostree" in ansible_facts.packages and "bootc" in ansible_facts.packages
      and not "openshift-kubelet" in ansible_facts.packages ) and not ( ansible_virtualization_type in ["docker", "lxc", "openvz",
      "podman", "container"] ) )
    - '"/home" in ansible_mounts | map(attribute="mount") | list'
    - device_name.stdout is defined and device_name.stdout_lines is defined
    - (device_name.stdout | length > 0)
    tags:
    - CCE-83871-4
    - DISA-STIG-RHEL-09-231045
    - configure_strategy
    - high_disruption
    - low_complexity
    - mount_option_home_nodev
    - no_reboot_needed
    - unknown_severity
  rescue:
  - name: 'StigForge: continue after error in ''Add nodev Option to /home: Create mount_info dictionary variable'' (OpenSCAP
      is the score gate)'
    ansible.builtin.debug:
      msg: 'StigForge: ''Add nodev Option to /home: Create mount_info dictionary variable'' raised an error (module or templating)
        and was skipped; continuing so later rules still run. OpenSCAP evaluates the resulting system state independently.'
- block:
  - name: 'Add nodev Option to /home: If /home not mounted, craft mount_info manually'
    set_fact:
      mount_info: '{{ mount_info|default({})|combine({item.0: item.1}) }}'
    with_together:
    - - target
      - source
      - fstype
      - options
    - - /home
      - ''
      - ''

---
# StigForge supplements for RHEL 9 STIG - not overwritten by `stigforge generate`.
# Extends rhel8_stig supplement patterns + rootfiles/umask/pam_wheel gaps in docker verify.

- name: Ensure GPG check enabled for local packages (dnf)
  community.general.ini_file:
    dest: /etc/dnf/dnf.conf
    section: main
    option: localpkg_gpgcheck
    value: "1"
    no_extra_spaces: true
    create: true
  tags:
    - ensure_gpgcheck_local_packages

# RHEL-09-252035 / network_configure_name_resolution - "Configure Multiple DNS Servers
# in /etc/resolv.conf". The STIG offers two branches: if nsswitch has no `dns`, resolv.conf
# must be EMPTY; if it has `dns`, resolv.conf must carry >=2 nameservers.
#
# This role used to take the empty branch - it stripped `dns` from nsswitch and truncated
# /etc/resolv.conf. The OVAL check passed and name resolution was gone. On 2026-09-20 that
# failed five consecutive release legs across rhel-8, rhel-9 and alma-9; the alma-9 leg named
# it outright (`Curl error (6): Could not resolve host: mirrors.almalinux.org`), which also
# shows the long-standing `rhsm-repomd-unreachable` RCA was reading a DNS failure as a
# subscription one - Alma uses no RHSM. It was not only a build defect: a customer's STIG AMI
# would have booted with no resolver.
#
# The rule's own rationale forbids that reading: "A failure in name resolution could lead to
# the failure of security functions requiring name resolution, which may include time
# synchronization, centralized authentication, and remote system logging." Emptying
# resolv.conf causes exactly what the rule exists to prevent.
#
# So: keep `dns` in nsswitch and never truncate resolv.conf here. The >=2-nameserver half is
# deliberately NOT done at this point - writing resolv.conf mid-hardening is what broke the
# build, and with NetworkManager `dns=default` (var_networkmanager_dns_mode) NM owns the file
# and would overwrite any static write after the FIPS reboot anyway. That half is tracked
# separately; until it lands, this rule scores as it truly is rather than being satisfied by
# breaking the system.
- name: Keep DNS in host resolution order (STIG name resolution - RHEL-09-252035)
  ansible.builtin.lineinfile:
    path: /etc/nsswitch.conf
    regexp: '^hosts:'
    line: "hosts:      files dns myhostname"
  tags:
    - network_configure_name_resolution

- name: Find ungrouped files on local mounts (verify scope)
  ansible.builtin.shell: |
    set -euo pipefail
    mounts="$(findmnt -n -l -k -it "$(awk '/nodev/ { print $2 }' /proc/filesystems | paste -sd,)" -o TARGET 2>/dev/null || true)"
    for mp in $mounts; do
      find "$mp" -xdev -nogroup 2>/dev/null || true
    done
  register: stigforge_nogroup_files
  changed_when: false
  tags:
    - file_permissions_ungroupowned

- name: Assign root group to ungrouped files
  ansible.builtin.file:
    path: "{{ item }}"
    group: root
  loop: "{{ stigforge_nogroup_files.stdout_lines | select('match', '.+') | list }}"
  when: stigforge_nogroup_files.stdout_lines | length > 0
  tags:
    - file_permissions_ungroupowned

- name: Ensure rootfiles package is installed (rootfiles_configured prerequisite)
  ansible.builtin.package:
    name: rootfiles
    state: present
  tags:
    - rootfiles_configured

- name: Set default umask in /etc/bashrc (accounts_umask_etc_bashrc)
  ansible.builtin.lineinfile:
    path: /etc/bashrc
    regexp: '^\s*umask\s+'
    line: "umask 077"
    state: present
  tags:
    - accounts_umask_etc_bashrc

- name: Ensure wheel group exists for su restriction (use_pam_wheel_for_su)
  ansible.builtin.group:
    name: wheel
    state: present
  tags:
    - use_pam_wheel_for_su

- name: Require wheel group membership for su (use_pam_wheel_for_su)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^\s*auth\s+required\s+pam_wheel\.so'
    line: "auth             required        pam_wheel.so use_uid"
    state: present
  tags:
    - use_pam_wheel_for_su

# FIPS mode - RHEL-09-671010. Owner decision 2026-09-20: enablement belongs to the ROLE, and it is
# NOT a toggle. FIPS is derived from the STIG profile, never chosen: every `stig` image is
# FIPS and nothing else ever is. A per-rule variable would make it a choice, so these tasks
# deliberately carry only DISA/CCE tags - the generator derives a toggle from an SSG rule-id
# tag, and these do not match that pattern, so no `{{ role }}_enable_fips_mode` is created.
#
# SSG ships no ANSIBLE remediation for this rule (only `urn:xccdf:fix:script:sh` and an
# osbuild blueprint), which is why the generator emits nothing for it and it has to live
# here in the supplement - exactly what the supplement is for.
#
# Scope is enablement only. The reboot, the post-reboot verification, the `boot=UUID=`
# cmdline repair for a separate /boot, and pinning the FIPS kernel against the autoremover
# stay in the factory: they are build orchestration, not configuration.
- name: FIPS | Check whether FIPS mode is already enabled
  ansible.builtin.command: fips-mode-setup --check
  register: stigforge_fips_check
  changed_when: false
  failed_when: false
  tags:
    - DISA-STIG-RHEL-09-671010
    - CCE-88742-2
    - high_severity

- name: FIPS | Enable FIPS mode (RHEL-09-671010)
  ansible.builtin.command: fips-mode-setup --enable
  register: stigforge_fips_enable
  # Idempotency guard, not an opt-out: re-running on an already-FIPS host is a no-op.
  when: "'FIPS mode is enabled' not in (stigforge_fips_check.stdout | default(''))"
  changed_when: stigforge_fips_enable.rc == 0
  failed_when: stigforge_fips_enable.rc != 0
  tags:
    - DISA-STIG-RHEL-09-671010
    - CCE-88742-2
    - high_severity
    - reboot_required

# ---------------------------------------------------------------------------------------
# Beyond-benchmark product hardening, moved out of the factory (decision 0021: StigForge
# roles own ALL hardening).
#
# These are NOT required by this profile. Verified against the SSG datastream:
#   - kernel_module_{dccp,freevxfs,hfs,hfsplus,jffs2,udf}_disabled are CIS rules, not STIG.
#     Only cramfs (RHEL-09-231195), sctp (RHEL-09-213060) and tipc (RHEL-09-213065) are in
#     the stig profile. On Ubuntu NONE of the nine are.
#   - sysctl_fs_suid_dumpable is in anssi/ccn/hipaa/pci-dss on RHEL and CIS on Ubuntu -
#     in neither the RHEL stig nor the RHEL cis profile.
#
# StigReady applies them to every hardened image anyway: CIS-grade module blacklisting and
# suid-dump hardening on a STIG image costs nothing at runtime and is strictly safer. That
# is a PRODUCT decision, which is why it lives in the role rather than being argued as a
# benchmark requirement.
#
# Tagged DISA/CCE only where a real identifier exists. The rest carry no rule-id tag on
# purpose - the generator derives a toggle from an SSG rule-id tag, and a product decision
# is not a per-rule opt-out. Idempotent: harmless where the profile already covers a module.
- name: Product hardening | Ensure kernel module 'cramfs' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/cramfs.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install cramfs /bin/true

      blacklist cramfs

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'dccp' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/dccp.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install dccp /bin/true

      blacklist dccp

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'freevxfs' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/freevxfs.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install freevxfs /bin/true

      blacklist freevxfs

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'hfs' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/hfs.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install hfs /bin/true

      blacklist hfs

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'hfsplus' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/hfsplus.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install hfsplus /bin/true

      blacklist hfsplus

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'jffs2' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/jffs2.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install jffs2 /bin/true

      blacklist jffs2

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'sctp' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/sctp.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install sctp /bin/true

      blacklist sctp

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'tipc' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/tipc.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install tipc /bin/true

      blacklist tipc

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Ensure kernel module 'udf' is disabled
  ansible.builtin.copy:
    dest: /etc/modprobe.d/udf.conf
    owner: root
    group: root
    mode: '0644'
    content: 'install udf /bin/true

      blacklist udf

      '
  tags:
  - low_disruption
  - no_reboot_needed
- name: Product hardening | Disable core dumps for SUID programs (fs.suid_dumpable)
  ansible.posix.sysctl:
    name: fs.suid_dumpable
    value: '0'
    sysctl_file: /etc/sysctl.d/91-stigready-product.conf
    sysctl_set: true
    reload: true
    state: present
  tags:
  - low_disruption
  - no_reboot_needed

# 2026-10-13 alma-9:stig prove-out (OpenSCAP 92.8%, 13 non-exempt failures). Each task below is the
# real remediation for a rule the generated body did not satisfy on the built image; the ARF named
# the failing OVAL test for each (scripts/openscap-rule-evidence.py).

# aide_check_audit_tools. AlmaLinux's datastream wants the selinux attribute on every audit tool
# line in aide.conf (p+i+n+u+g+s+b+acl+selinux+xattrs+sha512); the RHEL playbook writes it without.
- name: AIDE audit tools carry the selinux attribute (aide_check_audit_tools, AlmaLinux 9)
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^{{ item }}\s'
    line: '{{ item }} p+i+n+u+g+s+b+acl+selinux+xattrs+sha512'
  loop:
  - /usr/sbin/auditctl
  - /usr/sbin/auditd
  - /usr/sbin/ausearch
  - /usr/sbin/aureport
  - /usr/sbin/autrace
  - /usr/sbin/augenrules
  when:
  - ansible_facts['distribution'] == 'AlmaLinux'
  - '"aide" in ansible_facts.packages'
  tags:
  - aide_check_audit_tools
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

# file_permissions_sshd_drop_in_config. Every file under sshd_config.d must be 0600 root:root; the
# image's own drop-in (10-stigready.conf, written 0644) failed the rule. sshd reads these as root.
- name: Find the sshd drop-in configuration files
  ansible.builtin.find:
    paths: /etc/ssh/sshd_config.d
    patterns: '*.conf'
  register: stigforge_sshd_dropins
  tags:
  - file_permissions_sshd_drop_in_config
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

- name: Set sshd drop-in files to 0600 root:root (file_permissions_sshd_drop_in_config)
  ansible.builtin.file:
    path: '{{ item.path }}'
    owner: root
    group: root
    mode: '0600'
  loop: '{{ stigforge_sshd_dropins.files | default([]) }}'
  tags:
  - file_permissions_sshd_drop_in_config
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

# chronyd_server_directive. The rule needs at least one `server` time source and no `pool`; the cloud
# image's chrony.conf carried neither. 169.254.169.123 is the Amazon Time Sync Service, the
# AWS-recommended source and the one reachable from every VPC without internet access.
- name: Configure the Amazon Time Sync Service as a chrony server (chronyd_server_directive)
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    regexp: '^server\s'
    line: 'server 169.254.169.123 prefer iburst minpoll 4 maxpoll 4'
    create: true
    mode: '0644'
  tags:
  - chronyd_server_directive
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

# accounts_passwords_pam_faillock_deny / _interval / _unlock_time (RHEL-09-411075, -411080, -411085).
# The role defines var_accounts_passwords_pam_faillock_deny/_fail_interval/_unlock_time, but the
# generated rhel9_stig body carries no task for these three rules, so /etc/security/faillock.conf
# never received the values (alma-9:stig and rocky-9:stig 2026-10-13: the OVAL test
# *_parameter_faillock_conf was false, the pam.d structure tests were true).
- name: Set faillock deny, fail_interval and unlock_time in faillock.conf (STIG account lockout)
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^\s*#?\s*{{ item.key }}\s*='
    line: '{{ item.key }} = {{ item.value }}'
    create: true
    owner: root
    group: root
    mode: '0644'
  loop:
  - {key: deny, value: "{{ var_accounts_passwords_pam_faillock_deny | default('3') }}", rule: accounts_passwords_pam_faillock_deny}
  - {key: fail_interval, value: "{{ var_accounts_passwords_pam_faillock_fail_interval | default('900') }}", rule: accounts_passwords_pam_faillock_interval}
  - {key: unlock_time, value: "{{ var_accounts_passwords_pam_faillock_unlock_time | default('0') }}", rule: accounts_passwords_pam_faillock_unlock_time}
  loop_control:
    label: '{{ item.key }}'
  tags:
  - accounts_passwords_pam_faillock_deny
  - accounts_passwords_pam_faillock_interval
  - accounts_passwords_pam_faillock_unlock_time
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

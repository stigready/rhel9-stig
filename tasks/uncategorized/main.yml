  - name: 'StigForge: continue after error in ''Require wheel group membership for su (use_pam_wheel_for_su)'' (OpenSCAP is
      the score gate)'
    ansible.builtin.debug:
      msg: 'StigForge: ''Require wheel group membership for su (use_pam_wheel_for_su)'' raised an error (module or templating)
        and was skipped; continuing so later rules still run. OpenSCAP evaluates the resulting system state independently.'
  when: (stigforge_rules_enabled | default(true) | bool) and (rhel9stig_use_pam_wheel_for_su | default(true) | bool)

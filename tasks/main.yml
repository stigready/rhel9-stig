---
# Layout v2 - prelim then profile tasks.
- name: StigForge prelim (rhel9_stig)
  ansible.builtin.import_tasks: prelim.yml
  tags: [stigforge, prelim, rhel9_stig]

- name: "StigForge apply rhel9_stig profile {{ stigforge_profile }}"
  ansible.builtin.import_tasks: "{{ stigforge_profile }}.yml"
  ignore_errors: true
  tags: [stigforge, rhel9_stig]
